<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0d0d0d">
<title>अल्ट्रा प्रो ब्यूटी कैमरा</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#0d0d0d;color:#fff;font-family:'Segoe UI',Tahoma,sans-serif;overflow:hidden}
#app{display:flex;flex-direction:column;height:100%;max-width:520px;margin:0 auto}
.top{display:flex;gap:6px;padding:8px;justify-content:center;flex-wrap:wrap}
.ib{background:#1e1e1e;border:1px solid #3a3a3a;color:#fff;border-radius:12px;padding:7px 10px;font-size:13px;font-weight:600;cursor:pointer}
.ib.on{background:#ff4081;border-color:#ff4081}
.stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;position:relative}
.vf{position:relative;max-width:100%;max-height:100%;border-radius:18px;overflow:hidden;background:#000;box-shadow:0 8px 24px rgba(255,64,129,.28)}
#view{display:block;max-width:100%;max-height:100%}
#grid{position:absolute;inset:0;pointer-events:none;display:none;background:
linear-gradient(#fff4 1px,transparent 1px) 0 33.3%/100% 33.4% repeat-y,
linear-gradient(90deg,#fff4 1px,transparent 1px) 33.3% 0/33.4% 100% repeat-x}
#flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;transition:opacity .15s}
#screenTorch{position:absolute;inset:0;border:28px solid #fff;border-radius:18px;pointer-events:none;display:none;box-shadow:inset 0 0 40px #fff}
#count{position:absolute;inset:0;display:none;align-items:center;justify-content:center;font-size:110px;font-weight:800;color:#ff4081;text-shadow:0 0 14px #000}
#rec{position:absolute;top:10px;left:12px;background:#e53935;border-radius:10px;padding:3px 9px;font-size:13px;display:none}
#zoomWrap{position:absolute;bottom:8px;left:12px;right:12px;display:none}
#zoomWrap input{width:100%;accent-color:#ff4081}
#faceTag{position:absolute;top:10px;right:12px;font-size:11px;background:#0008;padding:3px 8px;border-radius:10px}
.panel{background:#161616;border-top:1px solid #2a2a2a;padding:6px 10px;height:112px;overflow-y:auto}
.tabs{display:flex;justify-content:center;gap:6px;padding:6px 8px 0}
.tab{background:none;border:none;color:#999;font-size:14px;font-weight:700;padding:5px 12px;border-bottom:2px solid transparent;cursor:pointer}
.tab.on{color:#ff4081;border-color:#ff4081}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0}
.chip{flex:0 0 auto;background:#222;border:1px solid #3a3a3a;color:#fff;border-radius:20px;padding:8px 14px;font-size:13px;cursor:pointer}
.chip.on{background:#ff4081;border-color:#ff4081}
.row{display:flex;align-items:center;gap:8px;font-size:12px;color:#ccc;margin:3px 0}
.row span:first-child{width:92px}.row span:last-child{width:34px;text-align:right}
.row input{flex:1;accent-color:#ff4081}
.bar{display:flex;align-items:center;justify-content:space-around;padding:10px 8px 14px;background:#0d0d0d}
.shutter{width:72px;height:72px;border-radius:50%;border:5px solid #fff;background:#ff4081;cursor:pointer;transition:.15s}
.shutter:active{transform:scale(.9)}
.shutter.video{background:#e53935}.shutter.rec{border-radius:20px;transform:scale(.8)}
.side{width:54px;height:54px;border-radius:50%;border:2px solid #555;background:#222 center/cover;color:#fff;font-size:22px;cursor:pointer}
.mode{display:flex;justify-content:center;gap:16px;padding-top:4px;background:#0d0d0d}
.mode b{font-size:13px;color:#888;cursor:pointer;padding:2px 8px}.mode b.on{color:#ffd54f}
#gal{position:fixed;inset:0;background:#0d0d0df2;z-index:50;display:none;flex-direction:column;padding:10px}
#gal .gh{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
#gg{flex:1;overflow:auto;display:grid;grid-template-columns:repeat(3,1fr);gap:6px;align-content:start}
#gg img,#gg video{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px;cursor:pointer}
#big{position:fixed;inset:0;background:#000;z-index:60;display:none;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:10px}
#big img,#big video{max-width:100%;max-height:75%;border-radius:12px}
#big .acts{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
#toast{position:fixed;bottom:130px;left:50%;transform:translateX(-50%);background:#000c;padding:8px 16px;border-radius:20px;font-size:13px;display:none;z-index:99}
</style>
</head>
<body>
<div id="app">
  <div class="top">
    <button class="ib" id="bTorch">💡 टॉर्च</button>
    <button class="ib" id="bScreen">📱 फ्लैश</button>
    <button class="ib" id="bGrid">▦ ग्रिड</button>
    <button class="ib" id="bTimer">⏱ 0s</button>
    <button class="ib" id="bRatio">📐 4:3</button>
    <button class="ib on" id="bMirror">🪞 मिरर</button>
    <button class="ib" id="bMark">🏷 स्टैम्प</button>
  </div>

  <div class="stage">
    <div class="vf" id="vf">
      <canvas id="view"></canvas>
      <div id="grid"></div>
      <div id="screenTorch"></div>
      <div id="flash"></div>
      <div id="count"></div>
      <div id="rec">● <span id="recT">00:00</span></div>
      <div id="faceTag"></div>
      <div id="zoomWrap">🔍 <input type="range" id="zoom" min="1" max="4" step="0.1" value="1" style="width:calc(100% - 28px)"></div>
    </div>
  </div>

  <div class="tabs">
    <button class="tab on" data-t="f">🎨 फिल्टर</button>
    <button class="tab" data-t="b">💖 ब्यूटी</button>
    <button class="tab" data-t="a">⚙️ एडजस्ट</button>
  </div>
  <div class="panel" id="panel"></div>

  <div class="mode"><b id="mPhoto" class="on">फोटो</b><b id="mVideo">वीडियो</b></div>
  <div class="bar">
    <button class="side" id="bGal">🖼</button>
    <button class="shutter" id="shutter"></button>
    <button class="side" id="bSwitch">🔄</button>
  </div>
</div>

<div id="gal">
  <div class="gh"><b>📂 गैलरी (<span id="gc">0</span>)</b><button class="ib" id="gClose">✕ बंद</button></div>
  <div id="gg"></div>
</div>
<div id="big"><div id="bigM"></div><div class="acts">
  <button class="ib on" id="aDl">📥 डाउनलोड</button><button class="ib" id="aSh">📤 शेयर</button>
  <button class="ib" id="aDel">🗑 हटाएं</button><button class="ib" id="aX">✕ बंद</button></div></div>
<div id="toast"></div>
<canvas id="cap" style="display:none"></canvas>

<script>
const $=id=>document.getElementById(id);
const video=document.createElement('video');video.playsInline=true;video.muted=true;video.autoplay=true;
const view=$('view'),vctx=view.getContext('2d'),cap=$('cap');

// ---------- सेटिंग्स ----------
const S={facing:'user',mirror:true,ratio:4/3,ratioName:'4:3',timer:0,grid:false,mark:false,
  filter:'none',smooth:30,blush:0,whiten:0,bright:100,contrast:100,sat:100,warm:0,vig:0,mode:'photo'};
const FILTERS=[['नॉर्मल','none'],['ब्लैक&व्हाइट','grayscale(100%)'],['विंटेज','sepia(70%) contrast(95%)'],
['ग्लोइंग','saturate(170%) brightness(105%)'],['वार्म','sepia(30%) saturate(130%) hue-rotate(-10deg)'],
['कूल','saturate(110%) hue-rotate(15deg) brightness(102%)'],['फेड','contrast(85%) brightness(112%) saturate(85%)'],
['ड्रामा','contrast(140%) saturate(120%) brightness(92%)'],['सॉफ्ट','brightness(108%) contrast(92%)'],['नोयर','grayscale(100%) contrast(150%)']];
const SL={
 b:[['smooth','स्किन स्मूथ',0,100],['blush','फेस लाली',0,100],['whiten','ग्लो/गोरापन',0,100]],
 a:[['bright','ब्राइटनेस',50,170],['contrast','कॉन्ट्रास्ट',50,160],['sat','सैचुरेशन',0,220],['warm','वार्मथ',-60,60],['vig','विग्नेट',0,100]]};

// ---------- पैनल ----------
function showTab(t){
  document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('on',b.dataset.t===t));
  const p=$('panel');p.innerHTML='';
  if(t==='f'){
    const c=document.createElement('div');c.className='chips';
    FILTERS.forEach(([n,v])=>{const b=document.createElement('button');b.className='chip'+(S.filter===v?' on':'');b.textContent=n;
      b.onclick=()=>{S.filter=v;showTab('f')};c.appendChild(b)});
    p.appendChild(c);
  }else{
    SL[t].forEach(([k,n,mn,mx])=>{
      const r=document.createElement('div');r.className='row';
      r.innerHTML=`<span>${n}</span><input type="range" min="${mn}" max="${mx}" value="${S[k]}"><span>${S[k]}</span>`;
      const inp=r.querySelector('input'),lab=r.lastChild;
      inp.oninput=()=>{S[k]=+inp.value;lab.textContent=inp.value};
      p.appendChild(r);
    });
    const rs=document.createElement('button');rs.className='chip';rs.textContent='↺ रीसेट';
    rs.onclick=()=>{Object.assign(S,{smooth:30,blush:0,whiten:0,bright:100,contrast:100,sat:100,warm:0,vig:0});showTab(t)};
    p.appendChild(rs);
  }
}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>showTab(b.dataset.t));

// ---------- कैमरा ----------
let stream=null,track=null,torchOn=false,caps={};
async function initCamera(){
  if(stream)stream.getTracks().forEach(t=>t.stop());
  torchOn=false;$('bTorch').classList.remove('on');
  try{
    stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:S.facing},width:{ideal:1920},height:{ideal:1080}},audio:false});
    video.srcObject=stream;await video.play();
    track=stream.getVideoTracks()[0];caps=track.getCapabilities?track.getCapabilities():{};
    const z=$('zoomWrap');
    if(caps.zoom){const zi=$('zoom');zi.min=caps.zoom.min;zi.max=Math.min(caps.zoom.max,8);zi.step=caps.zoom.step||0.1;zi.value=caps.zoom.min;z.style.display='block'}
    else z.style.display='none';
  }catch(e){toast('कैमरा एक्सेस नहीं मिला: '+e.message)}
}
$('zoom').oninput=e=>{track&&track.applyConstraints({advanced:[{zoom:+e.target.value}]}).catch(()=>{})};
$('bSwitch').onclick=()=>{S.facing=S.facing==='user'?'environment':'user';S.mirror=S.facing==='user';
  $('bMirror').classList.toggle('on',S.mirror);initCamera()};
$('bTorch').onclick=async()=>{
  if(!track||!caps.torch){toast('इस कैमरे में टॉर्च नहीं है — "फ्लैश" (स्क्रीन) इस्तेमाल करें');return}
  torchOn=!torchOn;
  try{await track.applyConstraints({advanced:[{torch:torchOn}]});$('bTorch').classList.toggle('on',torchOn)}catch(e){toast('टॉर्च त्रुटि')}
};
$('bScreen').onclick=e=>{const s=$('screenTorch');const on=s.style.display!=='block';s.style.display=on?'block':'none';e.currentTarget.classList.toggle('on',on)};
$('bGrid').onclick=e=>{S.grid=!S.grid;$('grid').style.display=S.grid?'block':'none';e.currentTarget.classList.toggle('on',S.grid)};
$('bMirror').onclick=e=>{S.mirror=!S.mirror;e.currentTarget.classList.toggle('on',S.mirror)};
$('bMark').onclick=e=>{S.mark=!S.mark;e.currentTarget.classList.toggle('on',S.mark)};
$('bTimer').onclick=e=>{const o=[0,3,5,10];S.timer=o[(o.indexOf(S.timer)+1)%4];e.currentTarget.textContent='⏱ '+S.timer+'s';e.currentTarget.classList.toggle('on',S.timer>0)};
$('bRatio').onclick=e=>{const o=[['4:3',4/3],['1:1',1],['16:9',16/9],['3:4',3/4],['9:16',9/16]];
  let i=o.findIndex(x=>x[0]===S.ratioName);i=(i+1)%o.length;S.ratioName=o[i][0];S.ratio=o[i][1];e.currentTarget.textContent='📐 '+S.ratioName};

// ---------- फेस डिटेक्शन (सपोर्टेड ब्राउज़र में) ----------
let detector=null,faces=[],hasFD=false;
if('FaceDetector' in window){try{detector=new FaceDetector({fastMode:true,maxDetectedFaces:4});hasFD=true}catch(e){}}
setInterval(async()=>{
  if(!detector||video.readyState<2)return;
  try{faces=await detector.detect(video)}catch(e){faces=[]}
  $('faceTag').textContent=hasFD?(faces.length?'😊 '+faces.length+' चेहरा':'चेहरा नहीं मिला'):'';
},350);

// ---------- रेंडर इंजन ----------
function baseFilter(){
  const b=S.bright*(1+S.whiten/260),c=S.contrast*(1-S.whiten/700);
  return `brightness(${b}%) contrast(${c}%) saturate(${S.sat}%)`+(S.filter!=='none'?' '+S.filter:'');
}
function draw(ctx,W,H){
  const vw=video.videoWidth,vh=video.videoHeight;if(!vw)return;
  let sw=vw,sh=vw/S.ratio;if(sh>vh){sh=vh;sw=vh*S.ratio}
  const sx=(vw-sw)/2,sy=(vh-sh)/2,bf=baseFilter();
  ctx.save();
  if(S.mirror){ctx.translate(W,0);ctx.scale(-1,1)}
  ctx.filter=bf;ctx.drawImage(video,sx,sy,sw,sh,0,0,W,H);
  if(S.smooth>0){ctx.globalAlpha=Math.min(.75,S.smooth/100*.75);ctx.filter=`blur(${Math.max(1,W/170)}px) `+bf;ctx.drawImage(video,sx,sy,sw,sh,0,0,W,H);ctx.globalAlpha=1}
  ctx.restore();ctx.filter='none';
  // लाली
  if(S.blush>0){
    const spots=[];
    if(hasFD){faces.forEach(f=>{const b=f.boundingBox;let cx=(b.x+b.width/2-sx)/sw*W;const cy=(b.y+b.height*.64-sy)/sh*H;
      const dx=b.width*.27/sw*W,r=b.width*.24/sw*W;if(S.mirror)cx=W-cx;spots.push([cx-dx,cy,r],[cx+dx,cy,r])})}
    else spots.push([W*.35,H*.55,W*.15],[W*.65,H*.55,W*.15]);
    ctx.save();ctx.globalCompositeOperation='soft-light';
    spots.forEach(([x,y,r])=>{const g=ctx.createRadialGradient(x,y,0,x,y,r);
      g.addColorStop(0,`rgba(255,40,120,${S.blush/100*.9})`);g.addColorStop(1,'rgba(255,40,120,0)');ctx.fillStyle=g;ctx.fillRect(x-r,y-r,2*r,2*r)});
    ctx.restore();
  }
  if(S.warm!==0){ctx.save();ctx.globalCompositeOperation='soft-light';
    ctx.fillStyle=S.warm>0?`rgba(255,150,30,${S.warm/100*.7})`:`rgba(40,130,255,${-S.warm/100*.7})`;ctx.fillRect(0,0,W,H);ctx.restore()}
  if(S.vig>0){const g=ctx.createRadialGradient(W/2,H/2,Math.min(W,H)*.35,W/2,H/2,Math.max(W,H)*.75);
    g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,`rgba(0,0,0,${S.vig/100*.85})`);ctx.fillStyle=g;ctx.fillRect(0,0,W,H)}
}
function sizeView(){
  const st=document.querySelector('.stage'),aw=st.clientWidth,ah=st.clientHeight;
  let w=aw,h=w/S.ratio;if(h>ah){h=ah;w=h*S.ratio}
  const pw=Math.min(720,Math.round(Math.max(w,h)>720?720:Math.max(w,h)));
  const pwW=S.ratio>=1?pw:Math.round(pw*S.ratio),pwH=S.ratio>=1?Math.round(pw/S.ratio):pw;
  if(view.width!==pwW||view.height!==pwH){view.width=pwW;view.height=pwH}
  view.style.width=w+'px';view.style.height=h+'px';
}
function loop(){sizeView();draw(vctx,view.width,view.height);requestAnimationFrame(loop)}
window.addEventListener('resize',sizeView);

// ---------- फोटो ----------
const gallery=[];
function beep(f=880,d=.08){try{const a=new (window.AudioContext||window.webkitAudioContext)(),o=a.createOscillator(),g=a.createGain();
  o.frequency.value=f;g.gain.value=.15;o.connect(g);g.connect(a.destination);o.start();o.stop(a.currentTime+d)}catch(e){}}
function countdown(n){return new Promise(res=>{if(!n)return res();const c=$('count');c.style.display='flex';
  let k=n;c.textContent=k;beep(660);const i=setInterval(()=>{k--;if(k>0){c.textContent=k;beep(660)}else{clearInterval(i);c.style.display='none';res()}},1000)})}
function stamp(ctx,W,H){if(!S.mark)return;ctx.fillStyle='rgba(255,255,255,.85)';ctx.shadowColor='#000';ctx.shadowBlur=4;
  ctx.font=Math.round(W/40)+'px Arial';ctx.fillText('📸 Beauty Cam • '+new Date().toLocaleString('hi-IN'),W/40,H-W/40);ctx.shadowBlur=0}
async function takePhoto(){
  await countdown(S.timer);
  const vw=video.videoWidth,vh=video.videoHeight;let sw=vw,sh=vw/S.ratio;if(sh>vh){sh=vh;sw=vh*S.ratio}
  cap.width=Math.round(sw);cap.height=Math.round(sh);
  const ctx=cap.getContext('2d');draw(ctx,cap.width,cap.height);stamp(ctx,cap.width,cap.height);
  const f=$('flash');f.style.opacity=.9;setTimeout(()=>f.style.opacity=0,120);beep(1200,.05);navigator.vibrate&&navigator.vibrate(40);
  cap.toBlob(b=>addMedia(b,'image'),'image/jpeg',.95);
}
// ---------- वीडियो ----------
let rec=null,chunks=[],recTimer=null,recStart=0;
async function toggleRecord(){
  if(rec){rec.stop();return}
  await countdown(S.timer);
  const vw=video.videoWidth,vh=video.videoHeight;let sw=vw,sh=vw/S.ratio;if(sh>vh){sh=vh;sw=vh*S.ratio}
  const sc=Math.min(1,1280/Math.max(sw,sh));cap.width=Math.round(sw*sc);cap.height=Math.round(sh*sc);
  const cx=cap.getContext('2d');
  const out=cap.captureStream(30);
  try{const a=await navigator.mediaDevices.getUserMedia({audio:true});a.getAudioTracks().forEach(t=>out.addTrack(t))}catch(e){}
  const mime=['video/webm;codecs=vp9,opus','video/webm;codecs=vp8,opus','video/webm','video/mp4'].find(m=>MediaRecorder.isTypeSupported(m));
  rec=new MediaRecorder(out,mime?{mimeType:mime}:{});chunks=[];
  const drawId=setInterval(()=>{draw(cx,cap.width,cap.height);stamp(cx,cap.width,cap.height)},33);
  rec.ondataavailable=e=>e.data.size&&chunks.push(e.data);
  rec.onstop=()=>{clearInterval(drawId);clearInterval(recTimer);out.getTracks().forEach(t=>t.stop());
    addMedia(new Blob(chunks,{type:rec.mimeType||'video/webm'}),'video');rec=null;
    $('shutter').classList.remove('rec');$('rec').style.display='none'};
  rec.start();recStart=Date.now();$('rec').style.display='block';$('shutter').classList.add('rec');
  recTimer=setInterval(()=>{const s=Math.floor((Date.now()-recStart)/1000);$('recT').textContent=String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')},500);
}
$('shutter').onclick=()=>S.mode==='photo'?takePhoto():toggleRecord();
function setMode(m){S.mode=m;$('mPhoto').classList.toggle('on',m==='photo');$('mVideo').classList.toggle('on',m==='video');$('shutter').classList.toggle('video',m==='video')}
$('mPhoto').onclick=()=>{if(!rec)setMode('photo')};$('mVideo').onclick=()=>setMode('video');

// ---------- गैलरी ----------
function addMedia(blob,type){
  const url=URL.createObjectURL(blob);gallery.unshift({blob,type,url,name:(type==='image'?'photo-':'video-')+Date.now()+(type==='image'?'.jpg':'.webm')});
  if(type==='image')$('bGal').style.backgroundImage=`url(${url})`;
  toast(type==='image'?'फोटो सेव हुई ✔ (गैलरी में)':'वीडियो सेव हुआ ✔');
}
function renderGal(){
  $('gc').textContent=gallery.length;const g=$('gg');g.innerHTML='';
  gallery.forEach((m,i)=>{const e=document.createElement(m.type==='image'?'img':'video');e.src=m.url;if(m.type==='video')e.muted=true;e.onclick=()=>openBig(i);g.appendChild(e)});
  if(!gallery.length)g.innerHTML='<p style="grid-column:1/-1;text-align:center;color:#888">अभी कोई फोटो/वीडियो नहीं</p>';
}
let cur=-1;
function openBig(i){cur=i;const m=gallery[i];$('bigM').innerHTML=m.type==='image'?`<img src="${m.url}" style="max-width:100%;max-height:70vh;border-radius:12px">`:`<video src="${m.url}" controls autoplay style="max-width:100%;max-height:70vh;border-radius:12px"></video>`;$('big').style.display='flex'}
$('bGal').onclick=()=>{renderGal();$('gal').style.display='flex'};
$('gClose').onclick=()=>$('gal').style.display='none';
$('aX').onclick=()=>{$('big').style.display='none';$('bigM').innerHTML=''};
$('aDl').onclick=()=>{const m=gallery[cur],a=document.createElement('a');a.href=m.url;a.download=m.name;a.click()};
$('aSh').onclick=async()=>{const m=gallery[cur];try{const f=new File([m.blob],m.name,{type:m.blob.type});
  if(navigator.canShare&&navigator.canShare({files:[f]}))await navigator.share({files:[f],title:'Beauty Cam'});else toast('शेयर सपोर्ट नहीं — डाउनलोड करें')}catch(e){}};
$('aDel').onclick=()=>{URL.revokeObjectURL(gallery[cur].url);gallery.splice(cur,1);$('aX').click();renderGal();
  const l=gallery.find(x=>x.type==='image');$('bGal').style.backgroundImage=l?`url(${l.url})`:''};
